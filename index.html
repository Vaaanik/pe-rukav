<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Виробництво поліетиленового рукава до 500 мм, полотна до 1000 мм, пакетів зі швом і дном та друку логотипа. Кривий Ріг. Цілі рулони та продукція на замовлення.">
<meta name="keywords" content="поліетиленовий рукав, плівка поліетиленова, рукав ПЕ, пакети з логотипом, полиэтиленовый рукав, Кривий Ріг">
<meta property="og:type" content="website">
<meta property="og:title" content="ПЕ Рукав Кривий Ріг">
<meta property="og:description" content="Рукав, полотно і пакети з поліетилену власного виробництва. Друк логотипа. Рулони та замовлення.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230A6F94'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ПЕ Рукав Кривий Ріг</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap&subset=cyrillic,latin">
<style>
/* Layout: промышленный каталог. Слева текст и действия, справа чертёж: рулон, рукав, полотно до 1000 мм. Дальше секции с чёткой сеткой. */
:root {
  --bg: #EDF1F3;
  --surface: #F8FAFB;
  --ink: #12222B;
  --muted: #4F6470;
  --line: #C6D3DA;
  --accent: #0A6F94;
  --accent-ink: #FFFFFF;
  --film: #D3E5EE;
  --note: #E4EEF3;
  --font-display: "Unbounded", "Onest", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D161B; --surface: #142027; --ink: #E6EEF2; --muted: #93A8B3;
    --line: #29404B; --accent: #4FB6DC; --accent-ink: #06161D; --film: #1B3440; --note: #182A33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D161B; --surface: #142027; --ink: #E6EEF2; --muted: #93A8B3;
  --line: #29404B; --accent: #4FB6DC; --accent-ink: #06161D; --film: #1B3440; --note: #182A33;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  margin: 0;
}
.wrap { max-width: 1120px; margin: 0 auto; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font: 700 clamp(26px, 5vw, 48px)/1.1 var(--font-display); letter-spacing: -0.02em; }
h2 { font: 700 clamp(22px, 3.4vw, 32px)/1.15 var(--font-display); letter-spacing: -0.01em; }
h3 { font: 600 17px/1.3 var(--font-body); }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.label { font: 500 12px/1.3 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; padding-block: 16px; border-bottom: 1px solid var(--line); }
.brand { font: 700 15px/1 var(--font-display); letter-spacing: 0.02em; }
.brand span { color: var(--accent); }
.nav { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 14px; align-items: center; }
.nav a { color: var(--muted); text-decoration: none; }
.nav a:hover { color: var(--ink); }
.lang { display: flex; gap: 4px; }
.lang button { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 12px/1 var(--font-mono); padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 44px 36px; }
.hero p.lead { margin-top: 18px; max-width: 54ch; color: var(--muted); font-size: 17.5px; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.btn { appearance: none; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 600 15px/1 var(--font-body); padding: 14px 20px; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:hover { filter: brightness(1.08); }
.hero-facts { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); }
.fact b { display: block; font: 500 21px/1.2 var(--font-mono); }
.fact span { font-size: 13px; color: var(--muted); }
.draw { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 0; }
.draw svg { width: 100%; height: auto; display: block; }
.draw figcaption { margin-top: 8px; font-size: 12.5px; color: var(--muted); }

/* sections */
section { padding-block: 40px; border-top: 1px solid var(--line); }
.sec-head { display: grid; gap: 10px; margin-bottom: 26px; max-width: 64ch; }
.sec-head p { color: var(--muted); }

.formats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.fmt { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 12px; align-content: start; }
.fmt ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--muted); }
.fmt .label { color: var(--accent); }
.fmt.alt { background: var(--film); border-color: transparent; }

/* catalog */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 14px/1 var(--font-body); padding: 10px 14px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filters.sub { margin-bottom: 8px; }
.filters.last { margin-bottom: 22px; }
.filters .gap-label { align-self: center; margin-right: 4px; min-width: 64px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.photo { aspect-ratio: 4 / 3; max-width: 100%; background: var(--film); display: grid; place-items: center; }
.photo svg, .photo img { width: 100%; height: 100%; display: block; }
.photo img { object-fit: cover; }
.card .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.card .tag { font: 500 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 8px; border-radius: 4px; background: var(--film); color: var(--ink); }
.card .tag.custom { background: var(--accent); color: var(--accent-ink); }
.card p { color: var(--muted); font-size: 14.5px; flex: 1; }
.spec { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; padding-top: 10px; border-top: 1px dashed var(--line); margin: 0; }
.spec dt { color: var(--muted); }
.spec dd { margin: 0; font-family: var(--font-mono); text-align: right; }
.card .btn { padding: 11px 14px; font-size: 14px; text-align: center; }
.empty { color: var(--muted); padding: 20px 0; }

/* calculator */
.calc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
.field { display: grid; gap: 6px; margin-bottom: 16px; align-content: start; }
.field:last-child { margin-bottom: 0; }
label { font-size: 14px; font-weight: 500; }
input[type="number"], input[type="text"], input[type="tel"], select, textarea {
  width: 100%; font: 400 16px/1.3 var(--font-body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 12px;
}
textarea { min-height: 88px; resize: vertical; }
.hint { font-size: 12.5px; color: var(--muted); }
.results { display: grid; }
.res { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.res:last-of-type { border-bottom: 0; }
.res span { color: var(--muted); font-size: 14px; }
.res b { font: 500 20px/1.2 var(--font-mono); text-align: right; }
.res.main b { color: var(--accent); font-size: 26px; }

/* limits */
.limits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.limits ul { margin: 12px 0 0; padding-left: 18px; display: grid; gap: 8px; }
.limits .no { background: var(--note); }
.limits .panel p { color: var(--muted); font-size: 14.5px; margin-top: 12px; }

/* steps */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.step { border-top: 3px solid var(--accent); padding-top: 14px; display: grid; gap: 6px; align-content: start; }
.step p { color: var(--muted); font-size: 14.5px; }

/* form */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
.form .full { grid-column: 1 / -1; }
.out { margin-top: 18px; display: grid; gap: 10px; }
.out pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 400 14px/1.5 var(--font-mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
.contacts { display: grid; gap: 14px; align-content: start; }
.contacts .row { display: grid; gap: 4px; }
.contacts .row b { font: 500 18px/1.3 var(--font-mono); word-break: break-word; }
.msgr { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.msgr a { font: 500 13px/1 var(--font-body); padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: var(--accent); background: var(--bg); }
.sendbox { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 0.6fr); gap: 20px; }
footer { padding-top: 28px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }

@media (max-width: 820px) {
  .hero, .formats, .calc, .limits, .steps, .sendbox, .form { grid-template-columns: minmax(0, 1fr); }
  .hero { padding-block: 28px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand" id="brand"></div>
    <nav class="nav" aria-label="Menu">
      <a href="#formats" data-i18n="nav_formats"></a>
      <a href="#catalog" data-i18n="nav_catalog"></a>
      <a href="#calc" data-i18n="nav_calc"></a>
      <a href="#limits" data-i18n="nav_limits"></a>
      <a href="#order" data-i18n="nav_order"></a>
      <div class="lang" id="lang" role="group" aria-label="Language"></div>
    </nav>
  </header>

  <div class="hero">
    <div>
      <p class="label" data-i18n="hero_label"></p>
      <h1 style="margin-top:14px" data-i18n="hero_h1"></h1>
      <p class="lead" data-i18n="hero_lead"></p>
      <div class="cta-row">
        <a class="btn" href="#order" data-i18n="cta1"></a>
        <a class="btn ghost" href="#catalog" data-i18n="cta2"></a>
      </div>
      <div class="hero-facts">
        <div class="fact"><b data-i18n="f1b"></b><span data-i18n="f1s"></span></div>
        <div class="fact"><b data-i18n="f2b"></b><span data-i18n="f2s"></span></div>
        <div class="fact"><b data-i18n="f3b"></b><span data-i18n="f3s"></span></div>
      </div>
    </div>
    <figure class="draw">
      <svg viewBox="0 0 460 290" role="img" data-i18n-aria="svg_aria">
        <!-- 1. рулон, вид с торца -->
        <g fill="none" stroke="var(--muted)" stroke-width="1.2">
          <circle cx="60" cy="110" r="50" fill="var(--film)" stroke="var(--ink)" stroke-width="1.6"/>
          <circle cx="60" cy="110" r="38"/>
          <circle cx="60" cy="110" r="27"/>
          <circle cx="60" cy="110" r="16" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.6"/>
        </g>
        <text x="60" y="190" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--muted)" data-i18n="s_roll"></text>
        <!-- 2. рукав в сложенном виде 500 мм -->
        <rect x="140" y="60" width="90" height="100" fill="var(--film)" stroke="var(--ink)" stroke-width="1.6"/>
        <line x1="140" y1="110" x2="230" y2="110" stroke="var(--muted)" stroke-width="1" stroke-dasharray="5 4"/>
        <g stroke="var(--accent)" stroke-width="1.4">
          <line x1="140" y1="44" x2="230" y2="44"/>
          <line x1="140" y1="38" x2="140" y2="50"/>
          <line x1="230" y1="38" x2="230" y2="50"/>
        </g>
        <text x="185" y="32" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--accent)" data-i18n="s_500"></text>
        <text x="185" y="190" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--muted)" data-i18n="s_sleeve"></text>
        <!-- разрез -->
        <g stroke="var(--accent)" stroke-width="1.6" fill="var(--accent)">
          <line x1="244" y1="110" x2="268" y2="110"/>
          <path d="M268 104 L278 110 L268 116 Z"/>
        </g>
        <text x="260" y="134" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--accent)" data-i18n="s_cut"></text>
        <!-- 3. полотно после разреза 1000 мм -->
        <rect x="288" y="60" width="160" height="100" fill="var(--film)" stroke="var(--ink)" stroke-width="1.6"/>
        <g stroke="var(--accent)" stroke-width="1.4">
          <line x1="288" y1="44" x2="448" y2="44"/>
          <line x1="288" y1="38" x2="288" y2="50"/>
          <line x1="448" y1="38" x2="448" y2="50"/>
        </g>
        <text x="368" y="32" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--accent)" data-i18n="s_1000"></text>
        <text x="368" y="190" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--muted)" data-i18n="s_flat"></text>
        <!-- толщина -->
        <text x="230" y="238" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--accent)" data-i18n="s_thick"></text>
        <line x1="90" y1="256" x2="370" y2="256" stroke="var(--line)" stroke-width="1"/>
      </svg>
      <figcaption data-i18n="cap"></figcaption>
    </figure>
  </div>

  <section id="formats">
    <div class="sec-head">
      <p class="label" data-i18n="fmt_label"></p>
      <h2 data-i18n="fmt_h2"></h2>
      <p data-i18n="fmt_p"></p>
    </div>
    <div class="formats">
      <div class="fmt">
        <p class="label" data-i18n="fmt1_l"></p>
        <h3 data-i18n="fmt1_h"></h3>
        <ul><li data-i18n="fmt1_a"></li><li data-i18n="fmt1_b"></li><li data-i18n="fmt1_c"></li></ul>
      </div>
      <div class="fmt alt">
        <p class="label" data-i18n="fmt2_l"></p>
        <h3 data-i18n="fmt2_h"></h3>
        <ul><li data-i18n="fmt2_a"></li><li data-i18n="fmt2_b"></li><li data-i18n="fmt2_c"></li></ul>
      </div>
    </div>
  </section>

  <section id="catalog">
    <div class="sec-head">
      <p class="label" data-i18n="cat_label"></p>
      <h2 data-i18n="cat_h2"></h2>
      <p data-i18n="cat_p"></p>
    </div>
    <div class="filters sub" id="catFilters" role="group"></div>
    <div class="filters sub" id="typeFilters" role="group"></div>
    <div class="filters last" id="modeFilters" role="group"></div>
    <div class="grid" id="grid" aria-live="polite"></div>
  </section>

  <section id="calc">
    <div class="sec-head">
      <p class="label" data-i18n="calc_label"></p>
      <h2 data-i18n="calc_h2"></h2>
      <p data-i18n="calc_p"></p>
    </div>
    <div class="calc">
      <div class="panel">
        <div class="field">
          <label for="cMode" data-i18n="c_mode"></label>
          <select id="cMode">
            <option value="sleeve" data-i18n="c_mode_s"></option>
            <option value="flat" data-i18n="c_mode_f"></option>
          </select>
        </div>
        <div class="field">
          <label for="cW" data-i18n="c_w"></label>
          <input type="number" id="cW" value="500" min="50" max="500" step="10" inputmode="numeric">
          <span class="hint" id="cWHint"></span>
        </div>
        <div class="field">
          <label for="cT" data-i18n="c_t"></label>
          <input type="number" id="cT" value="100" min="30" max="500" step="10" inputmode="numeric">
          <span class="hint" data-i18n="c_t_h"></span>
        </div>
        <div class="field">
          <label for="cL" data-i18n="c_l"></label>
          <input type="number" id="cL" value="100" min="1" max="5000" step="10" inputmode="numeric">
        </div>
      </div>
      <div class="panel">
        <div class="results">
          <div class="res main"><span data-i18n="r_m"></span><b id="rM"></b></div>
          <div class="res"><span data-i18n="r_m1"></span><b id="rM1"></b></div>
          <div class="res"><span data-i18n="r_flat"></span><b id="rFlat"></b></div>
          <div class="res"><span data-i18n="r_area"></span><b id="rArea"></b></div>
        </div>
        <p class="hint" style="margin-top:14px" data-i18n="c_note"></p>
      </div>
    </div>
  </section>

  <section id="limits">
    <div class="sec-head">
      <p class="label" data-i18n="lim_label"></p>
      <h2 data-i18n="lim_h2"></h2>
      <p data-i18n="lim_p"></p>
    </div>
    <div class="limits">
      <div class="panel">
        <h3 data-i18n="lim_yes"></h3>
        <ul>
          <li data-i18n="y1"></li><li data-i18n="y2"></li><li data-i18n="y3"></li>
          <li data-i18n="y4"></li><li data-i18n="y5"></li><li data-i18n="y6"></li>
        </ul>
      </div>
      <div class="panel no">
        <h3 data-i18n="lim_no"></h3>
        <ul>
          <li data-i18n="n1"></li><li data-i18n="n2"></li><li data-i18n="n3"></li>
        </ul>
        <p data-i18n="lim_note"></p>
      </div>
    </div>
  </section>

  <section id="how">
    <div class="sec-head">
      <p class="label" data-i18n="how_label"></p>
      <h2 data-i18n="how_h2"></h2>
    </div>
    <div class="steps">
      <div class="step"><h3 data-i18n="st1h"></h3><p data-i18n="st1p"></p></div>
      <div class="step"><h3 data-i18n="st2h"></h3><p data-i18n="st2p"></p></div>
      <div class="step"><h3 data-i18n="st3h"></h3><p data-i18n="st3p"></p></div>
    </div>
  </section>

  <section id="order">
    <div class="sec-head">
      <p class="label" data-i18n="ord_label"></p>
      <h2 data-i18n="ord_h2"></h2>
      <p data-i18n="ord_p"></p>
    </div>
    <div class="sendbox">
      <form class="panel form" id="orderForm" novalidate>
        <div class="field">
          <label for="fName" data-i18n="f_name"></label>
          <input type="text" id="fName" autocomplete="name">
        </div>
        <div class="field">
          <label for="fPhone" data-i18n="f_phone"></label>
          <input type="tel" id="fPhone" autocomplete="tel" inputmode="tel">
        </div>
        <div class="field">
          <label for="fCat" data-i18n="f_cat"></label>
          <select id="fCat"></select>
        </div>
        <div class="field">
          <label for="fType" data-i18n="f_type"></label>
          <select id="fType"></select>
        </div>
        <div class="field">
          <label for="fMode" data-i18n="f_mode"></label>
          <select id="fMode"></select>
        </div>
        <div class="field">
          <label for="fQ" data-i18n="f_q"></label>
          <input type="text" id="fQ" data-i18n-ph="f_q_ph">
        </div>

  g.innerHTML = "";
  var list = ITEMS.filter(function (i) {
    return (state.cat === "all" || i.cat === state.cat) && (state.type === "all" || i.type === state.type) && (state.mode === "all" || i.mode === state.mode);
  });
  if (!list.length) { g.appendChild(el("p", "empty", tr("empty"))); return; }
  list.forEach(function (i) {
    var c = el("article", "card");
    var ph = el("div", "photo");
    if (IMAGES[i.id]) {
      var im = document.createElement("img");
      im.src = IMAGES[i.id]; im.alt = i.nm[li()]; im.loading = "lazy";
      ph.appendChild(im);
    } else {
      ph.innerHTML = PICTO[i.type];
    }
    c.appendChild(ph);
    var body = el("div", "body");
    var tags = el("div", "tags");
    tags.appendChild(el("span", "tag", tr("t_" + i.type)));
    tags.appendChild(el("span", "tag" + (i.mode === "custom" ? " custom" : ""), tr("mode_" + i.mode)));
    body.appendChild(tags);
    body.appendChild(el("h3", null, i.nm[li()]));
    body.appendChild(el("p", null, i.ds[li()]));
    var dl = el("dl", "spec");
    dl.appendChild(el("dt", null, tr("spec_w"))); dl.appendChild(el("dd", null, fmtDim(i.w, "mm")));
    dl.appendChild(el("dt", null, tr("spec_t"))); dl.appendChild(el("dd", null, fmtDim(i.t, "um")));
    body.appendChild(dl);
    var b = el("button", "btn", tr("request"));
    b.type = "button";
    b.addEventListener("click", function () { prefill(i); });
    body.appendChild(b);
    c.appendChild(body);
    g.appendChild(c);
  });
}

function prefill(i) {
  document.getElementById("fCat").value = i.cat;
  document.getElementById("fType").value = i.type;
  document.getElementById("fMode").value = i.mode;
  document.getElementById("fW").value = i.wv;
  document.getElementById("fT").value = i.tv;
  document.getElementById("fMsg").value = i.nm[li()];
  document.getElementById("order").scrollIntoView({ behavior: "smooth", block: "start" });
}

function fillSelect(id, opts) {
  var s = document.getElementById(id);
  var keep = s.value;
  s.innerHTML = "";
  opts.forEach(function (o) { var n = el("option", null, o[1]); n.value = o[0]; s.appendChild(n); });
  if (keep) s.value = keep;
}
function renderSelects() {
  fillSelect("fCat", CATS.map(function (c) { return [c, tr("c_" + c)]; }).concat([["other", tr("other")]]));
  fillSelect("fType", TYPES.map(function (x) { return [x, tr("t_" + x)]; }));
  fillSelect("fMode", [["roll", tr("mode_roll")], ["custom", tr("mode_custom")], ["unknown", tr("mode_unknown")]]);
}

/* калькулятор: масса погонного метра = ширина полотна × толщина × плотность */
function clamp(v, lo, hi) { v = parseFloat(v); if (isNaN(v)) v = lo; return Math.min(hi, Math.max(lo, v)); }
function nf(n, d) { return n.toLocaleString(LOCALE[lang], { maximumFractionDigits: d, minimumFractionDigits: 0 }); }
function calcLimits() { return document.getElementById("cMode").value === "flat" ? [100, 1000] : [50, 500]; }
function calc() {
  var lim = calcLimits();
  var flatMode = document.getElementById("cMode").value === "flat";
  var w = clamp(document.getElementById("cW").value, lim[0], lim[1]);
  var t = clamp(document.getElementById("cT").value, 30, 500);
  var l = clamp(document.getElementById("cL").value, 1, 5000);
  var flatMm = flatMode ? w : w * 2;
  var perMeterKg = (flatMm / 1000) * (t / 1e6) * 920;
  var total = perMeterKg * l;
  document.getElementById("rM").textContent = nf(total, total < 10 ? 2 : 1) + " " + tr("u_kg");
  document.getElementById("rM1").textContent = nf(perMeterKg * 1000, 1) + " " + tr("u_g");
  document.getElementById("rFlat").textContent = nf(flatMm, 0) + " " + tr("u_mm");
  document.getElementById("rArea").textContent = nf((flatMm / 1000) * l, 1) + " " + tr("u_m2");
  document.getElementById("cWHint").textContent = tr(flatMode ? "c_w_h_f" : "c_w_h_s");
}
function applyCalcMode() {
  var lim = calcLimits();
  var n = document.getElementById("cW");
  n.min = lim[0]; n.max = lim[1];
  n.value = clamp(n.value, lim[0], lim[1]);
  calc();
}
document.getElementById("cMode").addEventListener("change", function () {
  var n = document.getElementById("cW");
  n.value = document.getElementById("cMode").value === "flat" ? 1000 : 500;
  applyCalcMode();
});
["cW", "cT", "cL"].forEach(function (id) {
  var n = document.getElementById(id);
  n.addEventListener("input", calc);
  n.addEventListener("change", function () {
    var lim = id === "cW" ? calcLimits() : (id === "cT" ? [30, 500] : [1, 5000]);
    n.value = clamp(n.value, lim[0], lim[1]); calc();
  });
});

/* форма */
document.getElementById("orderForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var v = function (id) { return document.getElementById(id).value.trim(); };
  var sel = function (id) { var s = document.getElementById(id); return s.options[s.selectedIndex].textContent; };
  var lines = [tr("o_title")];
  if (v("fName")) lines.push(tr("o_name") + ": " + v("fName"));
  if (v("fPhone")) lines.push(tr("o_phone") + ": " + v("fPhone"));
  lines.push(tr("o_use") + ": " + sel("fCat"));
  lines.push(tr("o_type") + ": " + sel("fType"));
  lines.push(tr("o_mode") + ": " + sel("fMode"));
  var w = v("fW"), t = v("fT"), type = document.getElementById("fType").value;
  var wLimit = type === "sleeve" ? 500 : 1000;
  if (w) lines.push(tr("o_w") + ": " + w + " " + tr("mm") + (parseFloat(w) > wLimit ? " " + tr("warn_w") : ""));
  if (t) lines.push(tr("o_t") + ": " + t + " " + tr("um") + (parseFloat(t) > 500 ? " " + tr("warn_t") : ""));
  if (v("fQ")) lines.push(tr("o_q") + ": " + v("fQ"));
  if (v("fColor")) lines.push(tr("o_color") + ": " + v("fColor"));
  if (v("fPrint")) lines.push(tr("o_print") + ": " + v("fPrint"));
  if (v("fMsg")) lines.push(tr("o_msg") + ": " + v("fMsg"));
  var text = lines.join("\n");
  var note = document.getElementById("sendNote");
  var out = document.getElementById("out");
  document.getElementById("outText").textContent = text;
  document.getElementById("copyNote").textContent = "";
  if (!CONFIG.web3formsKey) { out.hidden = false; note.textContent = ""; return; }
  if (!v("fPhone")) { note.textContent = tr("need_phone"); document.getElementById("fPhone").focus(); return; }
  if (document.getElementById("fBot").checked) return;
  var btn = document.getElementById("fSubmit");
  btn.disabled = true; note.textContent = tr("sending"); out.hidden = true;
  fetch("https://api.web3forms.com/submit", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({
      access_key: CONFIG.web3formsKey,
      subject: "Нова заявка з сайту ПЕ Рукав: " + sel("fType") + (v("fName") ? ", " + v("fName") : ""),
      from_name: "Сайт ПЕ Рукав",
      message: text,
      "Мова сайту": LANG_LABEL[lang]
    })
  }).then(function (r) { return r.json(); }).then(function (d) {
    if (d && d.success) {
      note.textContent = tr("sent_ok");
      document.getElementById("orderForm").querySelectorAll("input[type=text], input[type=tel], input[type=number], textarea").forEach(function (n) { n.value = ""; });
    } else { throw new Error("fail"); }
  }).catch(function () {
    note.textContent = tr("sent_fail"); out.hidden = false;
  }).then(function () { btn.disabled = false; });
});
document.getElementById("copyBtn").addEventListener("click", function () {
  var text = document.getElementById("outText").textContent;
  var note = document.getElementById("copyNote");
  function fallback() {
    var r = document.createRange();
    r.selectNodeContents(document.getElementById("outText"));
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    note.textContent = tr("copy_fb");
  }
  try {
    navigator.clipboard.writeText(text).then(function () { note.textContent = tr("copied"); }, fallback);
  } catch (err) { fallback(); }
});

function setLang(l) {
  lang = l;
  try { localStorage.setItem("pe-rukav-lang", l); } catch (e) {}
  applyStatic(); renderLang(); renderFilters(); renderGrid(); renderSelects(); calc();
}

(function init() {
  var saved = null;
  try { saved = localStorage.getItem("pe-rukav-lang"); } catch (e) {}
  if (saved && LANGS.indexOf(saved) >= 0) lang = saved;
  else {
    var nav = ((navigator.language || "uk") + "").toLowerCase();
    if (nav.indexOf("ru") === 0) lang = "ru";
    else if (nav.indexOf("en") === 0) lang = "en";
    else lang = "uk";
  }
  setLang(lang);
})();
</script>
